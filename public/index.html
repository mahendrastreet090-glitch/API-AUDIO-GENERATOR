<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Audio Indonesia - Gemini AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex items-center justify-center">

  <div class="w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl">
    <h1 class="text-2xl font-bold mb-2 text-emerald-400">Audio Generator Logat Indonesia</h1>
    <p class="text-sm text-slate-400 mb-6">Menganalisis ekspresi & dialek Indonesia menggunakan logika Gemini AI.</p>

    <form id="ttsForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Kolom Narasi (Karakter Tidak Terbatas)</label>
        <textarea id="text" rows="5" required placeholder="Masukkan teks narasi di sini..."
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500"></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Pilihan Vibe</label>
          <select id="vibe" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-emerald-500">
            <option value="ceria">Ceria</option>
            <option value="sedih">Sedih</option>
            <option value="puitis">Puitis</option>
            <option value="misterius">Suara Misterius</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Karakter Suara</label>
          <select id="gender" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-emerald-500">
            <option value="wanita">Wanita</option>
            <option value="pria">Pria</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Tempo Suara: <span id="speedVal">1.0</span>x</label>
          <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="1.0"
            class="w-full accent-emerald-500 mt-2" oninput="document.getElementById('speedVal').innerText = this.value">
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition duration-200">
        Proses & Buat Audio
      </button>
    </form>

    <div id="result" class="mt-6 hidden border-t border-slate-700 pt-6">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Hasil Analisis Teks Gemini:</h2>
      <p id="processedText" class="text-xs italic bg-slate-900 p-3 rounded mb-4 text-slate-400"></p>

      <audio id="audioPlayer" controls class="w-full mb-4"></audio>

      <a id="downloadBtn" download="audio-indonesia.mp3"
        class="block text-center bg-slate-700 hover:bg-slate-600 text-sm font-medium py-2 rounded-lg transition">
        Download Audio (.MP3)
      </a>
    </div>
  </div>

  <script>
    document.getElementById('ttsForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const resultDiv = document.getElementById('result');

      submitBtn.innerText = 'Menganalisis & Mengolah Audio...';
      submitBtn.disabled = true;

      const payload = {
        text: document.getElementById('text').value,
        vibe: document.getElementById('vibe').value,
        gender: document.getElementById('gender').value,
        speed: document.getElementById('speed').value
      };

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const rawText = await res.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch (e) {
          alert('Error Server (HTTP ' + res.status + '):\n' + rawText.substring(0, 200));
          return;
        }

        if (res.ok && data.success) {
          document.getElementById('processedText').innerText = data.processedText;
          const player = document.getElementById('audioPlayer');
          player.src = data.audioUrl;
          document.getElementById('downloadBtn').href = data.audioUrl;
          resultDiv.classList.remove('hidden');
        } else {
          alert('Gagal: ' + (data.error || 'Terjadi kesalahan pada server.'));
        }
      } catch (err) {
        alert('Gagal terhubung ke server: ' + err.message);
      } finally {
        submitBtn.innerText = 'Proses & Buat Audio';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
